<!DOCTYPE html>
<html lang="fr"><head>
<meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta charset="UTF-8">
    <title>Platformer Studio v0.5b - Multi-Level Progression</title>
    <style>
        :root { --accent: #ff0055; --bg: #0d0d12; --panel: #16161e; --success: #00ff88; --selected: #ffaa00; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        #editor-ui { width: 320px; background: var(--panel); display: flex; flex-direction: column; border-right: 2px solid #222; z-index: 10; overflow-y: auto; user-select: none; -webkit-user-select: none; pointer-events: auto ; }
        .section { padding: 20px; border-bottom: 1px solid #333; }
        .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 10px; }
        .tile-opt { width: 50px; height: 50px; background: #222; border: 2px solid #444; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 24px; transition: 0.2s; }
        .tile-opt:hover { border-color: var(--accent); }
        .tile-opt.active { border-color: var(--accent); background: #333; box-shadow: 0 0 10px var(--accent); }

        #game-container { flex: 1; position: relative; display: flex; align-items: center; justify-content: center; background: radial-gradient(circle, #1a1a2e 0%, #0d0d12 100%); }
        canvas { background: transparent; box-shadow: 0 0 40px rgba(0,0,0,0.5); image-rendering: pixelated; }
        
        #play-btn { background: var(--accent); color: white; border: none; padding: 15px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1.1em; transition: 0.3s; }
        #play-btn.playing { background: var(--success); color: #000; }
        
        .file-ops { display: flex; gap: 10px; margin-top: 10px; }
        .file-btn { flex: 1; background: #333; color: #fff; border: 1px solid #444; padding: 8px; border-radius: 4px; cursor: pointer; font-size: 0.8em; font-weight: bold; }
        .file-btn:hover { background: #444; border-color: #666; }

        .hint { font-size: 0.8em; color: #888; margin-top: 10px; }
        
        #enemy-panel { display: none; background: #1e1e2e; border-radius: 8px; padding: 15px; margin-top: 10px; border: 1px solid #333; pointer-events: auto ; }
        #enemy-panel.visible { display: block; animation: slideIn 0.3s ease; }
        #enemy-panel.editing { border-color: var(--selected); box-shadow: 0 0 10px rgba(255, 170, 0, 0.3); }
        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        
        .param-group { margin-bottom: 12px; }
        .param-group label { display: block; font-size: 0.85em; color: #aaa; margin-bottom: 5px; }
        .param-group input[type="range"] { width: 100%; background: #333; }
        .param-value { float: right; color: var(--accent); font-weight: bold; }
        
        .selection-indicator { font-size: 0.8em; color: var(--selected); margin-bottom: 8px; display: none; }
        #enemy-panel.editing .selection-indicator { display: block; }
        
        #apply-btn { 
            background: var(--success); 
            color: #000; 
            border: none; 
            padding: 10px; 
            border-radius: 6px; 
            cursor: pointer; 
            width: 100%; 
            font-weight: bold; 
            margin-top: 10px;
            transition: 0.2s;
        }
        #apply-btn:hover { opacity: 0.9; }
        #apply-btn:active { transform: scale(0.98); }
        
        input[type="range"], select, textarea {
            pointer-events: auto !important;
            user-select: auto !important;
            -webkit-user-select: auto !important;
        }
        #level-out { user-select: text; -webkit-user-select: text; }
        
        /* Indicateur de progression */
        #level-progress {
            background: #1e1e2e;
            border-radius: 8px;
            padding: 12px 15px;
            margin-top: 10px;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        #level-progress button {
            transition: all 0.2s;
        }
        
        #level-progress button:hover:not(:disabled) {
            background: #444;
            border-color: #777;
            transform: scale(1.05);
        }
        
        #level-progress button:active:not(:disabled) {
            transform: scale(0.95);
        }
        
        #level-progress .current-level {
            font-weight: bold;
            color: var(--accent);
            font-size: 1.1em;
        }
        
        #level-progress .progress-bar {
            flex: 1;
            margin: 0 15px;
            height: 8px;
            background: #0d0d12;
            border-radius: 4px;
            overflow: hidden;
        }
        
        #level-progress .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--accent), var(--success));
            transition: width 0.5s ease;
            border-radius: 4px;
        }
        
        /* Popup de gestion des niveaux */
        #level-manager-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }
        #level-manager-overlay.visible { display: flex; }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        #level-manager {
            background: var(--panel);
            border: 2px solid var(--accent);
            border-radius: 12px;
            padding: 30px;
            width: 500px;
            max-height: 70vh;
            overflow-y: auto;
            box-shadow: 0 10px 50px rgba(255, 0, 85, 0.3);
            animation: slideUp 0.3s ease;
        }
        
        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        
        #level-manager h2 {
            margin: 0 0 20px 0;
            color: var(--accent);
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .level-list {
            background: #0d0d12;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 20px;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .level-item {
            background: #1e1e2e;
            padding: 12px 15px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 2px solid transparent;
            transition: 0.2s;
            cursor: pointer;
        }
        
        .level-item:hover {
            background: #252530;
            border-color: #444;
        }
        
        .level-item.active {
            border-color: var(--accent);
            background: #2a1a2a;
        }
        
        .level-item-info {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
        }
        
        .level-item-name {
            font-weight: bold;
            color: #fff;
        }
        
        .level-item-stats {
            font-size: 0.75em;
            color: #888;
        }
        
        .level-item-actions {
            display: flex;
            gap: 5px;
        }
        
        .level-action-btn {
            background: #333;
            border: 1px solid #555;
            color: #fff;
            padding: 5px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            transition: 0.2s;
        }
        
        .level-action-btn:hover {
            background: #444;
            border-color: #777;
        }
        
        .level-action-btn.danger:hover {
            background: #ff0055;
            border-color: #ff0055;
        }
        
        .rename-level-btn:hover {
            color: var(--accent) !important;
            transform: scale(1.1);
        }
        
        .level-manager-controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .level-manager-btn {
            flex: 1;
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        
        .level-manager-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .level-manager-btn.secondary {
            background: #333;
        }
        
        .level-manager-btn.secondary:hover {
            background: #444;
        }
        
        /* Popup de victoire */
        #victory-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.5s ease;
        }
        
        #victory-overlay.visible { display: flex; }
        
        #victory-popup {
            background: linear-gradient(135deg, #1e1e2e 0%, #2d1e3e 100%);
            border: 3px solid var(--success);
            border-radius: 20px;
            padding: 50px;
            text-align: center;
            box-shadow: 0 20px 80px rgba(0, 255, 136, 0.4);
            animation: victoryBounce 0.6s ease;
            max-width: 500px;
        }
        
        @keyframes victoryBounce {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        
        #victory-popup h1 {
            font-size: 3em;
            margin: 0 0 20px 0;
            color: var(--success);
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
            animation: glow 2s ease-in-out infinite;
        }
        
        @keyframes glow {
            0%, 100% { text-shadow: 0 0 20px rgba(0, 255, 136, 0.5); }
            50% { text-shadow: 0 0 40px rgba(0, 255, 136, 0.8), 0 0 60px rgba(0, 255, 136, 0.6); }
        }
        
        .victory-stats {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 25px;
            margin: 25px 0;
        }
        
        .victory-stat {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1.2em;
        }
        
        .victory-stat:last-child {
            border-bottom: none;
        }
        
        .victory-stat-label {
            color: #aaa;
        }
        
        .victory-stat-value {
            color: var(--success);
            font-weight: bold;
            font-size: 1.3em;
        }
        
        .victory-buttons {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        .victory-btn {
            flex: 1;
            padding: 15px 30px;
            font-size: 1.1em;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        
        .victory-btn.next {
            background: var(--success);
            color: #000;
        }
        
        .victory-btn.next:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.4);
        }
        
        .victory-btn.restart {
            background: var(--accent);
            color: white;
        }
        
        .victory-btn.restart:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(255, 0, 85, 0.4);
        }
        
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            top: -20px;
            background: var(--success);
            position: absolute;
            animation: confetti-fall 3s linear;
        }
        
        @keyframes confetti-fall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        
        /* Style des notifications Toast */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
        }

        .toast {
            background: var(--panel);
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            margin-bottom: 10px;
            min-width: 250px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            animation: slideIn 0.3s ease-out forwards;
            font-size: 14px;
        }

        .toast.success { border-left-color: var(--success); }
        .toast.warning { border-left-color: var(--selected); }

        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @keyframes fadeOut {
            to { transform: translateX(20px); opacity: 0; }
        }
    </style>
</head>
<body>

<div id="editor-ui">
    <div class="section">
        <h2 style="margin:0">Platformer Studio</h2>
        <div class="hint">2026.01.29 V0.5b</div>
    </div>
    
    <div class="section">
        <button id="play-btn">▶ TESTER LE NIVEAU</button>
        <button id="level-manager-btn" style="background: #333; color: white; border: none; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; font-size: 1em; margin-top: 10px; transition: 0.2s;">🗂️ GESTION DES NIVEAUX</button>
        
        <div id="level-progress">
            <button id="prev-level-btn" style="background: rgb(51, 51, 51); border: 1px solid rgb(85, 85, 85); color: rgb(255, 255, 255); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s; opacity: 1;" title="Niveau précédent">◀</button>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 8px; margin: 0 10px;">
                <div style="display: flex; align-items: center; justify-content: space-between;">
                    <div class="current-level" id="current-level-name">Niveau 2</div>
                    <div style="color: #888; font-size: 0.9em;"><span id="completed-levels">0</span>/<span id="total-levels">2</span></div>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill" style="width: 0%"></div>
                </div>
            </div>
            <button id="next-level-btn-edit" style="background: rgb(51, 51, 51); border: 1px solid rgb(85, 85, 85); color: rgb(255, 255, 255); padding: 8px 12px; border-radius: 6px; cursor: not-allowed; font-weight: bold; transition: 0.2s; opacity: 0.3;" title="Niveau suivant" disabled="disabled">▶</button>
        </div>
    </div>

    <div class="section">
        <label>Palette :</label>
        <div class="palette">
            <div class="tile-opt active" data-id="#" title="Mur">🧱</div>
            <div class="tile-opt" data-id="." title="Gomme">🧼</div>
            <div class="tile-opt" data-id="^" title="Pic">🔺</div>
            <div class="tile-opt" data-id="C" title="Pièce">🟡</div>
            <div class="tile-opt" data-id="E" title="Ennemi">👾</div>
            <div class="tile-opt" data-id="P" title="Joueur">🏃</div>
            <div class="tile-opt" data-id="F" title="Drapeau">🚩</div>
        </div>
        
        <div id="enemy-panel">
            <div class="selection-indicator">✏️ Ennemi sélectionné</div>
            <div style="color: var(--accent); font-weight: bold; margin-bottom: 10px; font-size: 0.9em;">⚙️ PARAMÈTRES</div>
            
            <div class="param-group">
                <label>Vitesse <span class="param-value" id="speed-val">2.0</span></label>
                <input type="range" id="enemy-speed" min="0.5" max="8" step="0.5" value="2">
            </div>
            
            <div class="param-group">
                <label>Zone (tiles) <span class="param-value" id="range-val">3</span></label>
                <input type="range" id="enemy-range" min="1" max="10" step="1" value="3">
            </div>
            
            <div class="param-group">
                <label>Direction</label>
                <select id="enemy-dir" style="width: 100%; background: #333; color: white; border: 1px solid #555; padding: 5px; border-radius: 4px;">
                    <option value="1" selected="selected">→ Droite</option>
                    <option value="-1">← Gauche</option>
                </select>
            </div>
            
            <button id="apply-btn">✓ APPLIQUER</button>
        </div>
    </div>

    <div class="section">
        <div class="file-ops">
            <button class="file-btn" onclick="saveMap()">💾 SAVE</button>
            <button class="file-btn" onclick="loadMap()">📁 LOAD</button>
        </div>
        <input type="file" id="file-input" style="display:none" accept=".json,.txt">
        <div class="hint" style="margin-top: 10px;">Sauvegarde/chargement du projet complet</div>
    </div>
</div>

<div id="game-container">
    <canvas id="c" width="1000" height="600"></canvas>
</div>

<!-- Popup de gestion des niveaux -->
<div id="level-manager-overlay" class="">
    <div id="level-manager">
        <h2>🗂️ Gestion des niveaux</h2>
        <div style="background: rgba(255,255,255,0.05); padding: 15px; border-radius: 8px; margin-bottom: 20px;">
        <label style="display: block; color: var(--accent); font-weight: bold; margin-bottom: 8px; font-size: 0.9em;">NOM DU JEU</label>
        <input type="text" id="game-project-name" value="Nom du Jeu" 
               style="width: 100px; background: #000; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 5px; font-size: 1.1em; outline: none; border-left: 4px solid var(--accent);">
&nbsp
        <div class="level-list" id="level-list"><div class="level-item">
                <div class="level-item-info">
                    <div>
                        <div class="level-item-name" style="display: flex; align-items: center; gap: 8px;">
                            <span class="level-name-text">Niveau 1</span>
                            <button class="rename-level-btn" onclick="renameLevel(0)" style="background: none; border: none; color: #888; cursor: pointer; font-size: 0.9em; padding: 2px 6px; transition: 0.2s;" title="Renommer">✏️</button>
                        </div>
                        <div class="level-item-stats">👾 0 | 🏃 | 🚩</div>
                    </div>
                </div>
                <div class="level-item-actions">
                    
                    <button class="level-action-btn" onclick="moveLevelDown(0)">⬇️</button>
                    <button class="level-action-btn danger" onclick="deleteLevel(' + index + ')">🗑️</button>
                </div>
            </div><div class="level-item active">
                <div class="level-item-info">
                    <div>
                        <div class="level-item-name" style="display: flex; align-items: center; gap: 8px;">
                            <span class="level-name-text">Niveau 2</span>
                            <button class="rename-level-btn" onclick="renameLevel(1)" style="background: none; border: none; color: #888; cursor: pointer; font-size: 0.9em; padding: 2px 6px; transition: 0.2s;" title="Renommer">✏️</button>
                        </div>
                        <div class="level-item-stats">👾 0 | 🏃 | 🚩</div>
                    </div>
                </div>
                <div class="level-item-actions">
                    <button class="level-action-btn" onclick="moveLevelUp(1)">⬆️</button>
                    
                    <button class="level-action-btn danger" onclick="deleteLevel(' + index + ')">🗑️</button>
                </div>
            </div></div>
            </div>
        <div class="level-manager-controls">
            <button class="level-manager-btn" id="add-level-btn">➕ Nouveau niveau</button>
        </div>
        
        <div class="level-manager-controls">
            <button class="level-manager-btn secondary" id="close-level-manager-btn">✕ Fermer</button>
        </div>
        &nbsp
        <div class="level-manager-controls">
            <button class="level-manager-btn" id="export-game-btn" style="background: #3498db;">🎮 Exporter le jeu</button>
        </div>
        
    </div>
</div>

<!-- Popup de victoire -->
<div id="victory-overlay">
    <div id="victory-popup">
        <h1 id="victory-title">🎉 NIVEAU TERMINÉ !</h1>
        
        <div class="victory-stats">
            <div class="victory-stat">
                <span class="victory-stat-label">🟡 Pièces collectées</span>
                <span class="victory-stat-value"><span id="victory-score">0</span>/<span id="victory-total">0</span></span>
            </div>
            <div class="victory-stat">
                <span class="victory-stat-label">⏱️ Temps</span>
                <span class="victory-stat-value" id="victory-time">0.00s</span>
            </div>
            <div class="victory-stat">
                <span class="victory-stat-label">📊 Progression</span>
                <span class="victory-stat-value" id="victory-progress">0/0</span>
            </div>
        </div>
        
        <div class="victory-buttons">
            <button class="victory-btn restart" id="restart-level-btn">🔄 Recommencer</button>
            <button class="victory-btn next" id="next-level-btn">➡️ Niveau suivant</button>
        </div>
    </div>
</div>
<div id="toast-container"></div>

<script>
    const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
    const playBtn = document.getElementById('play-btn');
    const enemyPanel = document.getElementById('enemy-panel');
    const victoryOverlay = document.getElementById('victory-overlay');
    
    const TILE = 40, ROWS = 15, COLS = 25;
    canvas.width = COLS * TILE; canvas.height = ROWS * TILE;

    let map = Array(ROWS).fill().map(() => Array(COLS).fill('.'));
    let currentTile = '#', isPlaying = false;
    let score = 0, timer = "0.00", startTime = 0;
    let totalCoins = 0; // Nombre total de pièces dans le niveau
    let lastTime = performance.now();
    let completedLevelsCount = 0; // Nombre de niveaux terminés dans la session de jeu
    
    // Système multi-niveaux
    let levels = [
        {
            id: 1,
            name: "Niveau 1",
            map: Array(ROWS).fill().map(() => Array(COLS).fill('.')),
            enemies: {}
        }
    ];
    let currentLevelIndex = 0;
    let playStartLevelIndex = 0; // Niveau de départ quand on clique sur PLAY
    
    let p = { x: 0, y: 0, vx: 0, vy: 0, w: 28, h: 36, ground: false };
    let inputs = {};
    
    let enemyData = {};
    let activeEnemies = [];
    let selectedEnemyPos = null;
    
    // UI refs
    const speedInput = document.getElementById('enemy-speed');
    const rangeInput = document.getElementById('enemy-range');
    const dirInput = document.getElementById('enemy-dir');
    const speedVal = document.getElementById('speed-val');
    const rangeVal = document.getElementById('range-val');
    const applyBtn = document.getElementById('apply-btn');

    const showNotification = (message, type = 'default') => {
        const container = document.getElementById('toast-container');
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        
        let icon = "🔔";
        if(type === 'success') icon = "✅";
        if(type === 'warning') icon = "⚠️";

        toast.innerHTML = `<span>${icon} &nbsp; ${message}</span>`;
        
        container.appendChild(toast);

        // Supprimer après 3 secondes
        setTimeout(() => {
            toast.style.animation = "fadeOut 0.3s ease-in forwards";
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    };

    // EXEMPLE DE REMPLACEMENT :
    // Au lieu de : alert("Il manque P ou F !");
    // Utilise : showNotification("Il manque le départ (P) ou la fin (F) !", "warning");

    // Mise à jour des labels
    speedInput.oninput = function(e) {
        speedVal.textContent = parseFloat(this.value).toFixed(1);
        e.stopPropagation();
    };
    
    rangeInput.oninput = function(e) {
        rangeVal.textContent = this.value;
        e.stopPropagation();
    };
    
    dirInput.onchange = function(e) {
        e.stopPropagation();
    };

    // Charger les valeurs d'un ennemi dans les sliders
    function loadEnemyToUI(key) {
        const data = enemyData[key];
        if (!data) {
            speedInput.value = 2;
            rangeInput.value = 3;
            dirInput.value = 1;
        } else {
            speedInput.value = parseFloat(data.speed) || 2;
            rangeInput.value = parseInt(data.range) || 3;
            dirInput.value = parseInt(data.dir) || 1;
        }
        speedVal.textContent = parseFloat(speedInput.value).toFixed(1);
        rangeVal.textContent = rangeInput.value;
    }

    // Bouton OK - Sauvegarde explicite
    applyBtn.onclick = function() {
        if (!selectedEnemyPos) return;
        
        const speed = parseFloat(speedInput.value);
        const range = parseInt(rangeInput.value);
        const dir = parseInt(dirInput.value);
        
        enemyData[selectedEnemyPos] = { speed, range, dir };
        
        const originalText = this.textContent;
        this.textContent = "✓ SAUVEGARDÉ !";
        this.style.background = "#00ff88";
        setTimeout(() => {
            this.textContent = originalText;
            this.style.background = "var(--success)";
        }, 600);
        
        updateOutput();
    };

    function getEnemyParams(key) {
        const data = enemyData[key];
        if (!data) return { speed: 2, range: 3, dir: 1 };
        return {
            speed: parseFloat(data.speed) || 2,
            range: parseInt(data.range) || 3,
            dir: parseInt(data.dir) || 1
        };
    }

    function saveMap() {
        saveCurrentLevel();
        const data = { 
            levels: levels,
            currentLevelIndex: currentLevelIndex,
            version: "0.5" 
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = 'platformer-project.json'; a.click();
        URL.revokeObjectURL(url);
    }

    function loadMap() { document.getElementById('file-input').click(); }

    document.getElementById('file-input').onchange = (e) => {
        const reader = new FileReader();
        reader.onload = (ev) => { 
            try {
                const data = JSON.parse(ev.target.result);
                
                if (data.map && !data.levels) {
                    levels = [{
                        id: 1,
                        name: "Niveau importé",
                        map: data.map,
                        enemies: data.enemies || {}
                    }];
                    currentLevelIndex = 0;
                } else if (data.levels) {
                    levels = data.levels;
                    currentLevelIndex = data.currentLevelIndex || 0;
                    
                    if (currentLevelIndex >= levels.length) {
                        currentLevelIndex = 0;
                    }
                } else {
                    throw new Error("Format invalide");
                }
                
                loadCurrentLevel();
                updateProgressUI();
                
            } catch(err) {
                showNotification("Erreur de chargement du fichier", "warning");
            }
        };
        reader.readAsText(e.target.files[0]);
    };

    const initEnemies = () => {
        activeEnemies = [];
        map.forEach((r, y) => {
            r.forEach((cell, x) => {
                if (cell === 'E') {
                    const key = `${x},${y}`;
                    const params = getEnemyParams(key);
                    
                    activeEnemies.push({
                        x: x * TILE, 
                        y: y * TILE + 4, 
                        w: 24, 
                        h: 28,
                        startX: x * TILE,
                        speed: params.speed * 0.5,
                        range: params.range * TILE,
                        dir: params.dir,
                        vx: 0,
                        color: `hsl(${Math.random() * 60 + 240}, 70%, 70%)`
                    });
                }
            });
        });
    };

    const updateEnemies = (dt) => {
        activeEnemies.forEach(enemy => {
            enemy.vx = enemy.speed * enemy.dir;
            enemy.x += enemy.vx * dt;
            
            const x1 = Math.floor(enemy.x / TILE);
            const x2 = Math.floor((enemy.x + enemy.w) / TILE);
            const y1 = Math.floor(enemy.y / TILE);
            const y2 = Math.floor((enemy.y + enemy.h) / TILE);
            
            let hit = false;
            for(let yy = y1; yy <= y2; yy++) {
                for(let xx = x1; xx <= x2; xx++) {
                    if(map[yy] && map[yy][xx] === '#') hit = true;
                }
            }
            
            if (hit) {
                enemy.dir *= -1;
                enemy.x += enemy.vx * dt * 2;
            }
            
            if (enemy.x > enemy.startX + enemy.range) {
                enemy.dir = -1;
                enemy.x = enemy.startX + enemy.range;
            } else if (enemy.x < enemy.startX - enemy.range) {
                enemy.dir = 1;
                enemy.x = enemy.startX - enemy.range;
            }
        });
    };

    const checkEnemyPlayerCollision = () => {
        for(let enemy of activeEnemies) {
            if (p.x < enemy.x + enemy.w && p.x + p.w > enemy.x &&
                p.y < enemy.y + enemy.h && p.y + p.h > enemy.y) {
                return true;
            }
        }
        return false;
    };

    const drawTile = (t, x, y) => {
        let px = x * TILE, py = y * TILE;
        const key = `${x},${y}`;
        
        if (t === '#') { ctx.fillStyle = '#2d3436'; ctx.fillRect(px, py, TILE, TILE); ctx.strokeStyle="#111"; ctx.strokeRect(px,py,TILE,TILE); }
        if (t === '^') { ctx.fillStyle = '#ff4757'; ctx.beginPath(); ctx.moveTo(px+5, py+TILE); ctx.lineTo(px+20, py+5); ctx.lineTo(px+35, py+TILE); ctx.fill(); }
        if (t === 'C') { ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(px+20, py+20, 8, 0, 7); ctx.fill(); }
        if (t === 'E' && !isPlaying) { 
            const isSel = (selectedEnemyPos === key);
            ctx.fillStyle = isSel ? '#ffaa00' : '#a29bfe'; 
            ctx.fillRect(px+8, py+12, 24, 28);
            ctx.fillStyle = '#000';
            ctx.fillRect(px+12, py+18, 4, 4);
            ctx.fillRect(px+24, py+18, 4, 4);
            
            if (isSel) {
                ctx.strokeStyle = '#ffaa00';
                ctx.lineWidth = 3;
                ctx.strokeRect(px+6, py+10, 28, 32);
                ctx.lineWidth = 1;
            }
            
            if (enemyData[key]) {
                ctx.strokeStyle = isSel ? '#ffaa00' : '#ff0055';
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                const r = (parseInt(enemyData[key].range) || 3) * TILE;
                ctx.moveTo(px + 20 - r, py + 5);
                ctx.lineTo(px + 20 + r, py + 5);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }
        if (t === 'P' && !isPlaying) { ctx.strokeStyle = '#00ff88'; ctx.strokeRect(px+5, py+5, TILE-10, TILE-10); }
        if (t === 'F') { ctx.fillStyle = '#2ecc71'; ctx.fillRect(px+10, py+5, 4, TILE-5); ctx.fillRect(px+14, py+5, 20, 15); }
    };

    const collide = (nx, ny) => {
        let x1 = Math.floor(nx/TILE), x2 = Math.floor((nx+p.w)/TILE);
        let y1 = Math.floor(ny/TILE), y2 = Math.floor((ny+p.h)/TILE);
        for(let i=y1; i<=y2; i++) for(let j=x1; j<=x2; j++)
            if(map[i] && map[i][j] === '#') return true;
        return false;
    };

    const checkTriggers = () => {
        let tx = Math.floor((p.x + p.w/2) / TILE);
        let ty = Math.floor((p.y + p.h/2) / TILE);
        if (map[ty] && map[ty][tx]) {
            let tile = map[ty][tx];
            if (tile === '^') reset();
            if (tile === 'C') { map[ty][tx] = '.'; score++; }
            if (tile === 'F') { 
                showVictoryScreen();
            }
        }
        if (checkEnemyPlayerCollision()) reset();
        if (p.y > canvas.height) reset();
    };

    const reset = () => {
        let found = false;
        map.forEach((r, y) => r.forEach((cell, x) => { 
            if(cell === 'P') { 
                p.x = x*TILE+6; 
                p.y = y*TILE; 
                found=true;
            } 
        }));
        if(!found) { 
            p.x = TILE; 
            p.y = TILE;
        }
        p.vx = p.vy = 0; 
        score = 0;
        
        // Compter le nombre total de pièces dans le niveau
        totalCoins = 0;
        map.forEach((r) => r.forEach((cell) => { 
            if(cell === 'C') totalCoins++; 
        }));
        
        startTime = Date.now();
        
        if(isPlaying) {
            initEnemies();
        }
    };

    const loop = (timestamp) => {
        let dt = Math.min((timestamp - lastTime) / 16.66, 2);
        lastTime = timestamp;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        map.forEach((r, y) => r.forEach((t, x) => drawTile(t, x, y)));

        if (isPlaying) {
            timer = ((Date.now() - startTime) / 1000).toFixed(2);
            updateEnemies(dt);
            
            activeEnemies.forEach(enemy => {
                ctx.fillStyle = enemy.color;
                ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
                ctx.fillStyle = '#000';
                const eyeOffset = enemy.dir > 0 ? 4 : -4;
                ctx.fillRect(enemy.x + 6 + eyeOffset, enemy.y + 6, 4, 4);
                ctx.fillRect(enemy.x + 14 + eyeOffset, enemy.y + 6, 4, 4);
                ctx.fillStyle = '#666';
                const legOffset = Math.sin(Date.now() / 100) * 3;
                ctx.fillRect(enemy.x + 6, enemy.y + 24 + legOffset, 4, 6);
                ctx.fillRect(enemy.x + 14, enemy.y + 24 - legOffset, 4, 6);
            });
            
            if (inputs['ArrowLeft']) p.vx -= 1.2 * dt;
            if (inputs['ArrowRight']) p.vx += 1.2 * dt;
            p.vx *= Math.pow(0.8, dt); p.vy += 0.8 * dt;

            p.x += p.vx * dt;
            if (collide(p.x, p.y)) { p.x -= p.vx * dt; p.vx = 0; }
            p.y += p.vy * dt; p.ground = false;
            if (collide(p.x, p.y)) {
                if(p.vy > 0) p.ground = true;
                p.y -= p.vy * dt; p.vy = 0;
            }
            if (inputs['ArrowUp'] && p.ground) p.vy = -14;
            checkTriggers();
            ctx.fillStyle = '#00ff88';
            ctx.fillRect(p.x, p.y, p.w, p.h);
        }
        
        ctx.fillStyle = "rgba(0, 0, 0, 0.6)"; 
        ctx.fillRect(0, 0, canvas.width, 40);
        ctx.fillStyle = "white"; 
        ctx.font = "bold 16px sans-serif";
        ctx.fillText(`🟡 ${score}/${totalCoins}`, 20, 25);
        ctx.fillText(`⏱️ ${timer}s`, canvas.width - 100, 25);
        
        requestAnimationFrame(loop);
    };

    const togglePlay = () => {
        if (!isPlaying) {
            if (!JSON.stringify(map).includes('P') && !JSON.stringify(map).includes('F')) {
                return showNotification("Le joueur et le drapeau sont absent de la map !", "warning");
            }
            if (!JSON.stringify(map).includes('P')) {
                return showNotification("Veuillez insérer un joueur sur la map !", "warning");
            }
            if (!JSON.stringify(map).includes('F')) {
                return showNotification("Veuillez insérer un drapeau sur la map !", "warning");
            }
            
            saveCurrentLevel();
            //loadCurrentLevel();

            isPlaying = true;
            playStartLevelIndex = currentLevelIndex;
            completedLevelsCount = 0;
            reset();
        } else {
            isPlaying = false;
            activeEnemies = [];
            loadCurrentLevel();
        }
        
        playBtn.textContent = isPlaying ? "⏹ STOP" : "▶ TEST";
        playBtn.classList.toggle('playing', isPlaying);
    };
    
    // Variable globale pour stocker le score de victoire
    let victoryScore = 0;
    
    // Écran de victoire avec confettis
    function showVictoryScreen() {
        if (!isPlaying) return;
        
        // IMPORTANT : Arrêter le jeu immédiatement
        const wasPlaying = isPlaying;
        isPlaying = false;
        
        victoryScore = score;
        const currentTime = timer;
        const currentTotal = totalCoins;
        
        completedLevelsCount++;
        
        // Créer des confettis
        createConfetti();
        
        // Afficher le popup après un court délai
        setTimeout(() => {
            document.getElementById('victory-score').textContent = victoryScore;
            document.getElementById('victory-total').textContent = currentTotal;
            document.getElementById('victory-time').textContent = currentTime + 's';
            document.getElementById('victory-progress').textContent = completedLevelsCount + '/' + levels.length;
            
            // Vérifier si c'est le dernier niveau
            const isLastLevel = (currentLevelIndex >= levels.length - 1);
            
            // Vérifier si toutes les pièces ont été collectées
            const isPerfect = (victoryScore === currentTotal && currentTotal > 0);
            
            if (isLastLevel) {
                document.getElementById('victory-title').textContent = isPerfect ? '🏆 PERFECT ! TOUS LES NIVEAUX TERMINÉS !' : '🏆 TOUS LES NIVEAUX TERMINÉS !';
                document.getElementById('next-level-btn').textContent = '🎮 Mode édition';
            } else {
                document.getElementById('victory-title').textContent = isPerfect ? '⭐ PERFECT ! NIVEAU TERMINÉ !' : '🎉 NIVEAU TERMINÉ !';
                document.getElementById('next-level-btn').textContent = '➡️ Niveau suivant';
            }
            
            victoryOverlay.classList.add('visible');
        }, 100);
    }
    
    // Créer des confettis
    function createConfetti() {
        const colors = ['#ff0055', '#00ff88', '#ffaa00', '#a29bfe', '#f1c40f'];
        for (let i = 0; i < 50; i++) {
            setTimeout(() => {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + '%';
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDelay = Math.random() * 0.5 + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3000);
            }, i * 30);
        }
    }
    
    // Supprimer tous les confettis
    function clearConfetti() {
        const confettis = document.querySelectorAll('.confetti');
        confettis.forEach(c => c.remove());
    }
    
    // Bouton "Recommencer le niveau"
    document.getElementById('restart-level-btn').onclick = () => {
        clearConfetti(); // Supprimer les confettis
        victoryOverlay.classList.remove('visible');
        isPlaying = true; // Remettre en mode jeu
        playBtn.textContent = "⏹ STOP";
        playBtn.classList.add('playing');
        reset();
    };
    
    // Bouton "Niveau suivant" / "Mode édition"
    document.getElementById('next-level-btn').onclick = () => {
        clearConfetti(); // Supprimer les confettis
        victoryOverlay.classList.remove('visible');
        
        if (currentLevelIndex >= levels.length - 1) {
            // Dernier niveau terminé - retour en mode édition
            isPlaying = false;
            playBtn.textContent = "▶ TEST";
            playBtn.classList.remove('playing');
            activeEnemies = [];
            loadCurrentLevel();
            // showNotification(`🎉 Félicitations ! Vous avez terminé tous les ${levels.length} niveaux !\n\nTemps total: ${timer}s\nPièces: ${victoryScore}`,"warning");
        } else {
            // Passer au niveau suivant
            saveCurrentLevel();
            currentLevelIndex++;
            loadCurrentLevel();
            updateProgressUI();
            isPlaying = true; // Garder le mode jeu actif
            playBtn.textContent = "⏹ STOP";
            playBtn.classList.add('playing');
            reset();
        }
    };

    canvas.onmousedown = (e) => {
        if(e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'TEXTAREA') {
            return;
        }
        
        if(e.target !== canvas) {
            return;
        }
        
        canvas.isDrawing = true; 
        handleCanvasClick(e); 
    };
    
    window.onmouseup = () => {
        canvas.isDrawing = false;
    };
    
    canvas.onmousemove = (e) => { 
        if(canvas.isDrawing) {
            handleCanvasClick(e);
        }
    };
    
    function handleCanvasClick(e) {
        if (isPlaying) return;
        
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') {
            return;
        }
        
        const rect = canvas.getBoundingClientRect();
        const x = Math.floor((e.clientX - rect.left) / TILE);
        const y = Math.floor((e.clientY - rect.top) / TILE);
        
        if (y < 0 || y >= ROWS || x < 0 || x >= COLS) return;

        const key = `${x},${y}`;

        if (currentTile === 'P' || currentTile === 'F') {
            for(let r = 0; r < ROWS; r++) {
                for(let c = 0; c < COLS; c++) {
                    if (map[r][c] === currentTile) {
                        map[r][c] = '.';
                    }
                }
            }
            map[y][x] = currentTile;
            updateOutput();
            return;
        }

        if (currentTile === 'E') {
            if (map[y][x] !== 'E') {
                map[y][x] = 'E';
                if (!enemyData[key]) {
                    enemyData[key] = {
                        speed: 2,
                        range: 3,
                        dir: 1
                    };
                }
                updateOutput();
            }
            
            selectedEnemyPos = key;
            loadEnemyToUI(key);
            
            enemyPanel.classList.add('visible', 'editing');
        } else {
            if (map[y][x] === 'E' && currentTile !== '.') {
                selectedEnemyPos = key;
                loadEnemyToUI(key);
                enemyPanel.classList.add('visible', 'editing');
                return;
            }
            
            if (currentTile === '.' && map[y][x] === 'E') {
                delete enemyData[key];
                if (selectedEnemyPos === key) {
                    selectedEnemyPos = null;
                    enemyPanel.classList.remove('editing');
                }
            }
            map[y][x] = currentTile;
            updateOutput();
        }
    }
    
    function updateOutput() {
        saveCurrentLevel(); // Auto-save dans le tableau
        // Plus besoin de textarea JSON
    }
    
    // Mise à jour de l'indicateur de progression
    function updateProgressUI() {
        const currentLevel = levels[currentLevelIndex];
        document.getElementById('current-level-name').textContent = currentLevel.name;
        document.getElementById('total-levels').textContent = levels.length;
        document.getElementById('completed-levels').textContent = completedLevelsCount;
        
        const progress = (completedLevelsCount / levels.length) * 100;
        document.getElementById('progress-fill').style.width = progress + '%';
        
        // Mettre à jour l'état des boutons de navigation
        const prevBtn = document.getElementById('prev-level-btn');
        const nextBtn = document.getElementById('next-level-btn-edit');
        
        if (prevBtn) {
            prevBtn.disabled = (currentLevelIndex === 0);
            prevBtn.style.opacity = (currentLevelIndex === 0) ? '0.3' : '1';
            prevBtn.style.cursor = (currentLevelIndex === 0) ? 'not-allowed' : 'pointer';
        }
        
        if (nextBtn) {
            nextBtn.disabled = (currentLevelIndex >= levels.length - 1);
            nextBtn.style.opacity = (currentLevelIndex >= levels.length - 1) ? '0.3' : '1';
            nextBtn.style.cursor = (currentLevelIndex >= levels.length - 1) ? 'not-allowed' : 'pointer';
        }
    }
    
    // Navigation entre les niveaux
    document.getElementById('prev-level-btn').onclick = () => {
        if (currentLevelIndex > 0) {
            saveCurrentLevel();
            currentLevelIndex--;
            loadCurrentLevel();
        }
    };
    
    document.getElementById('next-level-btn-edit').onclick = () => {
        if (currentLevelIndex < levels.length - 1) {
            saveCurrentLevel();
            currentLevelIndex++;
            loadCurrentLevel();
        }
    };

    document.querySelectorAll('.tile-opt').forEach(opt => opt.onclick = () => {
        document.querySelector('.tile-opt.active').classList.remove('active');
        opt.classList.add('active'); 
        currentTile = opt.dataset.id;
        
        if (currentTile === 'E') {
            enemyPanel.classList.add('visible');
        } else {
            if (!selectedEnemyPos) enemyPanel.classList.remove('visible');
        }
    });

    playBtn.onclick = togglePlay;
    window.onkeydown = (e) => { inputs[e.code] = true; if(e.code==='Enter' && e.target.tagName !== 'SELECT') togglePlay(); };
    window.onkeyup = (e) => inputs[e.code] = false;
    
    // === GESTION DES NIVEAUX ===
    
    const levelManagerOverlay = document.getElementById('level-manager-overlay');
    const levelManagerBtn = document.getElementById('level-manager-btn');
    const closeLevelManagerBtn = document.getElementById('close-level-manager-btn');
    const addLevelBtn = document.getElementById('add-level-btn');
    const levelListEl = document.getElementById('level-list');
    
    function loadCurrentLevel() {
        const level = levels[currentLevelIndex];
        map = JSON.parse(JSON.stringify(level.map));
        enemyData = JSON.parse(JSON.stringify(level.enemies));
        selectedEnemyPos = null;
        enemyPanel.classList.remove('editing');
        updateOutput();
        updateProgressUI();
    }
    
    function saveCurrentLevel() {
        const level = levels[currentLevelIndex];
        level.map = JSON.parse(JSON.stringify(map));
        level.enemies = JSON.parse(JSON.stringify(enemyData));
    }
    
    function renderLevelList() {
        levelListEl.innerHTML = '';
        
        levels.forEach((level, index) => {
            const div = document.createElement('div');
            div.className = 'level-item' + (index === currentLevelIndex ? ' active' : '');
            
            let enemyCount = Object.keys(level.enemies).length;
            let hasPlayer = JSON.stringify(level.map).includes('"P"');
            let hasFlag = JSON.stringify(level.map).includes('"F"');
            
            div.innerHTML = `
                <div class="level-item-info">
                    <div>
                        <div class="level-item-name" style="display: flex; align-items: center; gap: 8px;">
                            <span class="level-name-text">${level.name}</span>
                            <button class="rename-level-btn" onclick="renameLevel(${index})" style="background: none; border: none; color: #888; cursor: pointer; font-size: 0.9em; padding: 2px 6px; transition: 0.2s;" title="Renommer">✏️</button>
                        </div>
                        <div class="level-item-stats">👾 ${enemyCount} | ${hasPlayer ? '🏃' : '❌'} | ${hasFlag ? '🚩' : '❌'}</div>
                    </div>
                </div>
                <div class="level-item-actions">
                    ${index > 0 ? '<button class="level-action-btn" onclick="moveLevelUp(' + index + ')">⬆️</button>' : ''}
                    ${index < levels.length - 1 ? '<button class="level-action-btn" onclick="moveLevelDown(' + index + ')">⬇️</button>' : ''}
                    <button class="level-action-btn danger" onclick="deleteLevel(' + index + ')">🗑️</button>
                </div>
            `;
            
            div.querySelector('.level-item-info').onclick = () => {
                if (index !== currentLevelIndex) {
                    saveCurrentLevel();
                    currentLevelIndex = index;
                    loadCurrentLevel();
                    renderLevelList();
                }
            };
            
            levelListEl.appendChild(div);
        });
    }
    
    levelManagerBtn.onclick = () => {
        saveCurrentLevel();
        renderLevelList();
        levelManagerOverlay.classList.add('visible');
    };
    
    closeLevelManagerBtn.onclick = () => {
        levelManagerOverlay.classList.remove('visible');
    };
    
    levelManagerOverlay.onclick = (e) => {
        if (e.target === levelManagerOverlay) {
            levelManagerOverlay.classList.remove('visible');
        }
    };
    
    addLevelBtn.onclick = () => {
        const newLevel = {
            id: Date.now(),
            name: `Niveau ${levels.length + 1}`,
            map: Array(ROWS).fill().map(() => Array(COLS).fill('.')),
            enemies: {}
        };
        levels.push(newLevel);
        renderLevelList();
    };

    // Exporter le jeu jouable (HTML standalone)

    function exportPlayableGame() {
    const projectName = document.getElementById('game-project-name').value;
    const gameData = {
        levels: levels,
        version: "0.4"
    };
    
    const gameHTML = `<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> ${projectName}</title>
    <style>
        :root { --accent: #ff0055; --bg: #0d0d12; --success: #00ff88; }
        body { margin: 0; background: var(--bg); color: #fff; font-family: 'Inter', sans-serif; display: flex; height: 100vh; overflow: hidden; align-items: center; justify-content: center; }
        #game-container { position: relative; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        canvas { background: transparent; box-shadow: 0 0 40px rgba(0,0,0,0.5); image-rendering: pixelated; }
        .title { font-size: 2em; font-weight: bold; color: var(--accent); text-shadow: 0 0 20px rgba(255, 0, 85, 0.5); }
        .controls { font-size: 0.9em; color: #888; text-align: center; }
        
        #victory-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); z-index: 2000; align-items: center; justify-content: center;
        }
        #victory-overlay.visible { display: flex; animation: fadeIn 0.5s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        #victory-popup {
            background: linear-gradient(135deg, #1e1e2e 0%, #2d1e3e 100%);
            border: 3px solid var(--success); border-radius: 20px; padding: 50px; text-align: center;
            box-shadow: 0 20px 80px rgba(0, 255, 136, 0.4); animation: victoryBounce 0.6s ease; max-width: 500px;
        }
        @keyframes victoryBounce {
            0% { transform: scale(0.3) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.1) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .victory-stats { background: rgba(0, 0, 0, 0.3); border-radius: 12px; padding: 25px; margin: 25px 0; }
        .victory-stat { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); font-size: 1.2em; }
        .victory-buttons { display: flex; gap: 15px; margin-top: 30px; }
        .victory-btn { flex: 1; padding: 15px 30px; font-size: 1.1em; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; transition: 0.3s; }
        .victory-btn.next { background: var(--success); color: #000; }
        .victory-btn.restart { background: var(--accent); color: white; }
        
        /* FIX CONFETTI : position fixed et top obligatoire */
        .confetti { 
            position: fixed; 
            top: -20px; 
            width: 10px; 
            height: 10px; 
            z-index: 3000;
            animation: confetti-fall 3s linear forwards; 
        }
        @keyframes confetti-fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>
    <div id="game-container">
        <div class="title">🎮 ${projectName}</div>
        <canvas id="c"></canvas>
        <div class="controls">⬅️ ➡️ Déplacement | ⬆️ Sauter | ENTER Recommencer</div>
    </div>
    
    <div id="victory-overlay">
        <div id="victory-popup">
            <h1 id="victory-title">🎉 NIVEAU TERMINÉ !</h1>
            <div class="victory-stats">
                <div class="victory-stat">
                    <span class="victory-stat-label">🟡 Pièces collectées</span>
                    <span class="victory-stat-value"><span id="victory-score">0</span>/<span id="victory-total">0</span></span>
                </div>
                <div class="victory-stat">
                    <span class="victory-stat-label">⏱️ Temps</span>
                    <span class="victory-stat-value" id="victory-time">0.00s</span>
                </div>
                <div class="victory-stat">
                    <span class="victory-stat-label">📊 Progression</span>
                    <span class="victory-stat-value" id="victory-progress">0/0</span>
                </div>
            </div>
            <div class="victory-buttons">
                <button class="victory-btn restart" id="restart-level-btn">🔄 Recommencer</button>
                <button class="victory-btn next" id="next-level-btn">➡️ Niveau suivant</button>
            </div>
        </div>
    </div>
    
    <script>
        const GAME_DATA = ${JSON.stringify(gameData).replace(/\\/g, '\\\\')};
        const canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
        const victoryOverlay = document.getElementById('victory-overlay');
        const TILE = 40, ROWS = 15, COLS = 25;
        canvas.width = COLS * TILE; canvas.height = ROWS * TILE;
        
        let gameActive = true;
        let levels = GAME_DATA.levels;
        let currentLevelIndex = 0;
        let map = [];
        let enemyData = {};
        let score = 0, timer = "0.00", startTime = 0, totalCoins = 0;
        let lastTime = performance.now();
        let completedLevelsCount = 0;
        let p = { x: 0, y: 0, vx: 0, vy: 0, w: 28, h: 36, ground: false };
        let inputs = {};
        let activeEnemies = [];

        function loadLevel() {
            const level = levels[currentLevelIndex];
            map = JSON.parse(JSON.stringify(level.map));
            enemyData = JSON.parse(JSON.stringify(level.enemies || {}));
            reset();
        }

        function reset() {
            let found = false;
            map.forEach((r, y) => r.forEach((cell, x) => { if(cell === 'P') { p.x = x*TILE+6; p.y = y*TILE; found=true; } }));
            if(!found) { p.x = TILE; p.y = TILE; }
            p.vx = p.vy = 0; 
            score = 0;
            totalCoins = 0;
            map.forEach((r) => r.forEach((cell) => { if(cell === 'C') totalCoins++; }));
            startTime = Date.now();
            initEnemies();
            gameActive = true;
        }

        const initEnemies = () => {
            activeEnemies = [];
            map.forEach((r, y) => {
                r.forEach((cell, x) => {
                    if (cell === 'E') {
                        const data = enemyData[x + "," + y] || {speed:2, range:3, dir:1};
                        activeEnemies.push({
                            x: x * TILE, y: y * TILE + 4, w: 24, h: 28, startX: x * TILE,
                            speed: (parseFloat(data.speed)||2) * 0.5, range: (parseInt(data.range)||3) * TILE, 
                            dir: parseInt(data.dir)||1, vx: 0,
                            color: "hsl(" + (Math.random() * 60 + 240) + ", 70%, 70%)"
                        });
                    }
                });
            });
        };

        const loop = (timestamp) => {
            let dt = Math.min((timestamp - lastTime) / 16.66, 2);
            lastTime = timestamp;

            // FIX CHRONO : On ne met à jour que si gameActive est vrai
            if (gameActive) {
                timer = ((Date.now() - startTime) / 1000).toFixed(2);
                
                // Logique de mise à jour uniquement si actif
                if (inputs['ArrowLeft']) p.vx -= 1.2 * dt;
                if (inputs['ArrowRight']) p.vx += 1.2 * dt;
                p.vx *= Math.pow(0.8, dt); p.vy += 0.8 * dt;
                p.x += p.vx * dt;
                if (collide(p.x, p.y)) { p.x -= p.vx * dt; p.vx = 0; }
                p.y += p.vy * dt; p.ground = false;
                if (collide(p.x, p.y)) {
                    if(p.vy > 0) p.ground = true;
                    p.y -= p.vy * dt; p.vy = 0;
                }
                if (inputs['ArrowUp'] && p.ground) p.vy = -14;
                
                updateEnemies(dt);
                checkTriggers();
            }

            // Dessin (toujours actif pour voir le fond derrière l'overlay)
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            map.forEach((r, y) => r.forEach((t, x) => {
                let px = x * TILE, py = y * TILE;
                if (t === '#') { ctx.fillStyle = '#2d3436'; ctx.fillRect(px, py, TILE, TILE); }
                if (t === '^') { ctx.fillStyle = '#ff4757'; ctx.beginPath(); ctx.moveTo(px+5, py+TILE); ctx.lineTo(px+20, py+5); ctx.lineTo(px+35, py+TILE); ctx.fill(); }
                if (t === 'C') { ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(px+20, py+20, 8, 0, 7); ctx.fill(); }
                if (t === 'F') { ctx.fillStyle = '#2ecc71'; ctx.fillRect(px+10, py+5, 4, TILE-5); ctx.fillRect(px+14, py+5, 20, 15); }
            }));

            activeEnemies.forEach(enemy => {
                ctx.fillStyle = enemy.color;
                ctx.fillRect(enemy.x, enemy.y, enemy.w, enemy.h);
            });

            ctx.fillStyle = '#00ff88';
            ctx.fillRect(p.x, p.y, p.w, p.h);

            // UI
            ctx.fillStyle = "rgba(0, 0, 0, 0.6)";
            ctx.fillRect(0, 0, canvas.width, 40);
            ctx.fillStyle = "white"; ctx.font = "bold 16px sans-serif";
            ctx.fillText("🟡 " + score + "/" + totalCoins, 20, 25);
            ctx.fillText("⏱️ " + timer + "s", canvas.width - 100, 25);

            requestAnimationFrame(loop);
        };

        const collide = (nx, ny) => {
            let x1 = Math.floor(nx/TILE), x2 = Math.floor((nx+p.w)/TILE);
            let y1 = Math.floor(ny/TILE), y2 = Math.floor((ny+p.h)/TILE);
            for(let i=y1; i<=y2; i++) for(let j=x1; j<=x2; j++)
                if(map[i] && map[i][j] === '#') return true;
            return false;
        };

        const updateEnemies = (dt) => {
            activeEnemies.forEach(enemy => {
                enemy.vx = enemy.speed * enemy.dir;
                enemy.x += enemy.vx * dt;
                if (enemy.x > enemy.startX + enemy.range || enemy.x < enemy.startX - enemy.range) enemy.dir *= -1;
            });
        };

        const checkTriggers = () => {
            let tx = Math.floor((p.x + p.w/2) / TILE), ty = Math.floor((p.y + p.h/2) / TILE);
            if (map[ty] && map[ty][tx]) {
                if (map[ty][tx] === '^') reset();
                if (map[ty][tx] === 'C') { map[ty][tx] = '.'; score++; }
                if (map[ty][tx] === 'F') showVictoryScreen();
            }
            if (p.y > canvas.height) reset();
            for(let e of activeEnemies) {
                if (p.x < e.x + e.w && p.x + p.w > e.x && p.y < e.y + e.h && p.y + p.h > e.y) reset();
            }
        };

        function showVictoryScreen() {
            if (!gameActive) return;
            gameActive = false;
            completedLevelsCount++;
            createConfetti();

            document.getElementById('victory-score').textContent = score;
            document.getElementById('victory-total').textContent = totalCoins;
            document.getElementById('victory-time').textContent = timer + 's';
            document.getElementById('victory-progress').textContent = completedLevelsCount + '/' + levels.length;

            if (currentLevelIndex >= levels.length - 1) {
                document.getElementById('victory-title').textContent = '🏆 JEU TERMINÉ !';
                document.getElementById('next-level-btn').textContent = '🎮 Rejouer';
            } else {
                document.getElementById('victory-title').textContent = '🎉 NIVEAU TERMINÉ !';
                document.getElementById('next-level-btn').textContent = '➡️ Niveau suivant';
            }
            victoryOverlay.classList.add('visible');
        }

        function createConfetti() {
            for (let i = 0; i < 50; i++) {
                const confetti = document.createElement('div');
                confetti.className = 'confetti';
                confetti.style.left = Math.random() * 100 + 'vw';
                confetti.style.background = ['#ff0055', '#00ff88', '#ffaa00'][Math.floor(Math.random()*3)];
                confetti.style.animationDelay = Math.random() * 2 + 's';
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 3000);
            }
        }

        document.getElementById('restart-level-btn').onclick = () => {
            victoryOverlay.classList.remove('visible');
            reset();
        };

        document.getElementById('next-level-btn').onclick = () => {
            victoryOverlay.classList.remove('visible');
            if (currentLevelIndex >= levels.length - 1) {
                currentLevelIndex = 0;
                completedLevelsCount = 0;
            } else {
                currentLevelIndex++;
            }
            loadLevel();
        };

        window.onkeydown = (e) => { inputs[e.code] = true; if(e.code==='Enter') reset(); };
        window.onkeyup = (e) => inputs[e.code] = false;

        loadLevel();
        requestAnimationFrame(loop);
    <\/script>
</body>
</html>`;

    const blob = new Blob([gameHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = projectName;
    a.click();
    showNotification("Le Projet nommé : '" + projectName + "' à été exporté avec succès !", "success");
}
    
    window.deleteLevel = (index) => {
        if (levels.length === 1) {
            showNotification("Impossible de supprimer le dernier niveau !","warning");
            return;
        }
        
        if (!confirm(`Supprimer "${levels[index].name}" ?`)) {
            return;
        }
        
        levels.splice(index, 1);
        
        if (currentLevelIndex >= levels.length) {
            currentLevelIndex = levels.length - 1;
        }
        if (currentLevelIndex === index) {
            loadCurrentLevel();
        }
        
        renderLevelList();
    };
    
    window.renameLevel = (index) => {
        const currentName = levels[index].name;
        const newName = prompt("Nouveau nom du niveau :", currentName);
        
        if (newName && newName.trim() !== '' && newName !== currentName) {
            levels[index].name = newName.trim();
            renderLevelList();
            updateProgressUI(); // Mettre à jour l'affichage si c'est le niveau actuel
        }
    };
    
    window.moveLevelUp = (index) => {
        if (index === 0) return;
        
        [levels[index - 1], levels[index]] = [levels[index], levels[index - 1]];
        
        if (currentLevelIndex === index) {
            currentLevelIndex = index - 1;
        } else if (currentLevelIndex === index - 1) {
            currentLevelIndex = index;
        }
        
        renderLevelList();
    };
    
    window.moveLevelDown = (index) => {
        if (index === levels.length - 1) return;
        
        [levels[index], levels[index + 1]] = [levels[index + 1], levels[index]];
        
        if (currentLevelIndex === index) {
            currentLevelIndex = index + 1;
        } else if (currentLevelIndex === index + 1) {
            currentLevelIndex = index;
        }
        
        renderLevelList();
    };
    
    loadCurrentLevel();
    
    updateOutput();
    requestAnimationFrame(loop);
</script>
